<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BESS Leveringskalender GIGA Leopard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f5f7;--card:#fff;--fg:#0f1419;--mut:#6b7684;--line:#e6e9ee;--bd:#dbe0e7;--seg:#eceff3;--segon:#fff;--acc:#0f1419;--accfg:#fff;--volt:#c6f432;--hero:#0f1419;--bad:#d23f31;--ok:#1f8a4c;--warn:#a9690f;--sh:0 1px 2px rgba(15,20,25,.04),0 14px 36px -20px rgba(15,20,25,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0e12;--card:#12171d;--fg:#eef1f5;--mut:#8b96a4;--line:#1f262e;--bd:#2a333d;--seg:#1a2027;--segon:#27303a;--acc:#c6f432;--accfg:#0f1419;--hero:#18220c;--bad:#ff8577;--ok:#6fd58f;--warn:#e6b85c;--sh:0 1px 2px rgba(0,0,0,.4),0 14px 36px -20px rgba(0,0,0,.8)}}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    ::selection{background:var(--volt);color:#0f1419}
    body{background:radial-gradient(900px 420px at 92% -12%,rgba(198,244,50,.2),transparent 62%),radial-gradient(700px 380px at 0% -10%,rgba(120,150,255,.1),transparent 60%),var(--bg);color:var(--fg);font-family:'Geist',system-ui,sans-serif;font-size:14px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
    /* kop */
    .hd{position:sticky;top:0;z-index:20;padding-top:2px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
    .hd>div:first-child{padding-top:10px;padding-bottom:6px}
    .hd .navs{margin-bottom:10px}
    @media(max-width:640px){.brand small{display:none}}
    .brand{font:600 24px/1.1 'Bricolage Grotesque','Geist',sans-serif;letter-spacing:-.03em}
    .brand small{display:block;margin-top:4px;font:400 12.5px 'Geist',sans-serif;letter-spacing:0;color:var(--mut)}
    .navs{width:fit-content;max-width:calc(100% - 24px);margin:2px 12px 14px;padding:4px;gap:2px;border-radius:14px;background:var(--seg)}
    .tab{padding:7px 13px;border-radius:10px;color:var(--mut);font-weight:500;font-size:13px;white-space:nowrap;cursor:pointer;transition:color .2s,background .2s,box-shadow .2s}
    .tab:hover{color:var(--fg)}
    .tab.on{background:var(--segon);color:var(--fg);box-shadow:0 1px 2px rgba(15,20,25,.1),0 0 0 1px var(--line)}
    .bd{display:inline-block;min-width:19px;margin-left:7px;padding:0 6px;border-radius:99px;background:var(--volt);color:#0f1419;font-size:11px;font-weight:600;line-height:18px;text-align:center}
    /* basis */
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
    .btn{padding:6px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:500 13px 'Geist',sans-serif;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
    .btn:hover{background:var(--seg)}.btn:active{transform:scale(.98)}
    .btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg)}.btn.pri:hover{filter:brightness(1.15)}
    .btn.del{color:var(--bad)}.btn.del:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad)}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    input:not([type=checkbox]),select{width:100%;padding:8px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:400 14px 'Geist',sans-serif;transition:border-color .2s,box-shadow .2s}
    input:not([type=checkbox]):focus,select:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--volt) 55%,transparent)}
    input:disabled{background:transparent;color:var(--mut);border-color:var(--line)}
    main h1{font-family:'Bricolage Grotesque','Geist',sans-serif;font-size:34px!important;line-height:1.1!important;font-weight:600!important;letter-spacing:-.035em;margin-bottom:16px!important}
    main h2{margin:12px 0 10px!important;color:var(--mut);font:500 12px 'Geist',sans-serif!important;text-transform:uppercase;letter-spacing:.1em}
    /* tabellen */
    table{border-collapse:collapse;width:100%}
    th,td{padding:11px 14px;border:0;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    th{background:transparent;color:var(--mut);font-size:11.5px;font-weight:500;letter-spacing:.04em}
    table:not(.cal) tbody tr:last-child td{border-bottom:0}
    table:not(.cal) tbody tr{transition:background .15s}table:not(.cal) tbody tr:hover{background:var(--seg)}
    /* kalender */
    .cal{border-collapse:separate;border-spacing:0;overflow:hidden}
    .cal th,.cal td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}
    .cal tr>*:last-child{border-right:0}.cal tbody tr:last-child td{border-bottom:0}
    .cal th{padding:11px;text-align:center}
    .cal td{width:15.5%;height:122px;padding:7px 8px}
    .cal th.wk,.cal td.wk{width:48px;min-width:48px;padding:8px 4px;text-align:center}
    .cal td.wk{background:var(--seg);color:var(--mut)}
    .cal td.wk b{display:block;margin-top:2px;color:var(--fg);font:600 17px/1 'Bricolage Grotesque','Geist',sans-serif}
    .wkl{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .cal td.empty{background:color-mix(in srgb,var(--seg) 70%,transparent)}
    .dn{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11.5px}
    .dn b{color:var(--fg);font:600 14px 'Bricolage Grotesque','Geist',sans-serif;letter-spacing:-.02em}
    .add{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border-radius:50%;background:var(--seg);color:var(--fg);font-size:15px;line-height:1;cursor:pointer;transition:all .2s}
    .add:hover{background:var(--volt);color:#0f1419}
    .dc{--c:#888;margin-top:5px;padding:6px 9px;border-radius:11px;background:color-mix(in srgb,var(--c) 12%,var(--card));box-shadow:inset 3px 0 0 var(--c),inset 0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent);font-size:12.5px;line-height:1.4;cursor:pointer;transition:background .2s,transform .15s}
    .dc:hover{background:color-mix(in srgb,var(--c) 20%,var(--card));transform:translateY(-1px)}
    .dc b{font-weight:600}
    .st{display:inline-block;margin:4px 6px 0 0;padding:1px 9px;border:0;border-radius:99px;background:var(--seg);color:var(--mut);font:500 11px 'Geist',sans-serif;cursor:pointer;transition:all .2s}
    .st:hover{background:var(--bd);color:var(--fg)}
    .st.Bevestigd{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
    .st.Geleverd{background:var(--volt);color:#0f1419}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:500}
    .pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
    .pill.wait{background:var(--seg);color:var(--mut)}
    .pill.late{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
    /* voortgang en kpi */
    .bar{display:flex;height:8px;border-radius:99px;background:var(--seg);overflow:hidden}.bar i{display:block;height:100%}
    .card.kpi{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:2px;min-height:118px;padding:18px 20px!important}
    .kpi>span:first-child{display:block;font-size:12.5px;font-weight:500;line-height:1.3}
    .kpi b{display:block;margin:14px 0 0;font:600 44px/1 'Bricolage Grotesque','Geist',sans-serif;letter-spacing:-.04em}
    .kpi .text-xs{display:block;margin-top:4px;font-size:12px;color:var(--mut)}
    .xl\:grid-cols-6>.kpi:nth-child(1){background:var(--hero);border-color:var(--hero);color:#eef1f5}
    .xl\:grid-cols-6>.kpi:nth-child(1)>span:first-child,.xl\:grid-cols-6>.kpi:nth-child(1) .text-xs{color:rgba(238,241,245,.6)!important}
    .xl\:grid-cols-6>.kpi:nth-child(1) b{color:var(--volt)}
    .xl\:grid-cols-6>.kpi:nth-child(3){background:var(--volt);border-color:var(--volt);color:#0f1419}
    .xl\:grid-cols-6>.kpi:nth-child(3)>span:first-child,.xl\:grid-cols-6>.kpi:nth-child(3) .text-xs{color:rgba(15,20,25,.62)!important}
    .sw{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:50%}
    #modal{position:fixed;inset:0;background:rgba(10,14,18,.4);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:12px;z-index:30}
    #modal.on{display:flex}
    #modal .card{border-radius:22px;box-shadow:0 30px 80px -24px rgba(0,0,0,.45)}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px 10px 14px;border-radius:99px;background:#0f1419;color:#eef1f5;font-size:13px;box-shadow:var(--sh);display:none;z-index:40}
    #toast::before{content:'';display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:var(--volt)}
    @page{size:A3 landscape;margin:10mm}
    @media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.noprint{display:none!important}body{background:#fff;color:#000;font-size:13px}main{padding:0!important}.cal{table-layout:fixed}.cal th{font-size:15px;text-align:center;padding:6px}.cal td{width:17%;height:36mm;font-size:13px;padding:4px 6px}.cal th:last-child,.cal td:last-child{width:12%}.cal th.wk,.cal td.wk{width:3%;min-width:0}.dc{font-size:12.5px;padding:3px 7px}.dn{font-size:13px}.st{display:inline-block;font-size:11px}.card,tr{break-inside:avoid;box-shadow:none!important;border-radius:0}h1,main h1{font-size:26px!important}.kpi{background:#fff!important;color:#000!important}.kpi b{font-size:24px;color:#000!important}.kpi>span:first-child,.kpi .text-xs{color:#555!important}.cal{overflow:visible}.cal td.empty{background:#f3f4f6}.st.Geleverd{background:#c6f432;color:#0f1419}.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #0f2a43;margin-bottom:8px;padding-bottom:4px;font-size:12px}}
    .ibtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:38px;min-width:38px;padding:0 10px;border:1px solid var(--bd);border-radius:11px;background:var(--card);color:var(--fg);cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
    .ibtn:hover{background:var(--seg)}.ibtn:active{transform:scale(.96)}
    .ibtn.on{background:var(--volt);border-color:var(--volt);color:#0f1419}
    .ibtn[hidden]{display:none}
    .ic{width:18px;height:18px;flex:none}
    .ibtn .ic:nth-child(2){width:14px;height:14px;opacity:.6}
    .menu{position:relative}
    .menu-list{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:280px;padding:6px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
    .menu.open .menu-list{display:block}
    .mh{padding:8px 10px 4px;color:var(--mut);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
    .mi{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--fg);font:500 13px 'Geist',sans-serif;text-align:left;cursor:pointer;transition:background .15s}
    .mi:hover{background:var(--seg)}
    .mi .ic{color:var(--mut)}
    .mi small{margin-left:auto;color:var(--mut);font-size:11.5px;font-weight:400}
    .mdiv{height:1px;margin:6px 4px;background:var(--line)}
  .ibtn.pub{gap:6px;font:600 13px 'Geist',sans-serif}
.ibtn.pub.on{background:var(--volt);border-color:var(--volt);color:#0f1419}
.ibtn:disabled{opacity:.5;cursor:wait}
.draftbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:10px 12px 0;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 12%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.tab:disabled{opacity:.35;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--fg);font:500 12.5px 'Geist',sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{background:var(--seg)}.chip.on{border-color:var(--fg);background:var(--seg)}
.seg{display:inline-flex;gap:0}.seg .btn:first-child{border-radius:10px 0 0 10px}.seg .btn:last-child{border-radius:0 10px 10px 0;margin-left:-1px}.seg .btn.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.plan-wrap{display:block}
.plan-view{position:relative;height:clamp(340px,42vw,72vh);overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
.plan-vp{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.plan-vp.box{cursor:crosshair}.plan-vp:active{cursor:grabbing}
.plan-vp svg{display:block}
.plan-box{position:absolute;border:1.5px dashed #0f1419;background:rgba(198,244,50,.25);pointer-events:none}
.pu{vector-effect:non-scaling-stroke;stroke-width:1;cursor:pointer;transition:opacity .15s}
.pu.s-none{fill:rgba(148,163,184,.25);stroke:#94a3b8}
.pu.s-planned{fill:rgba(245,158,11,.5);stroke:#b45309}
.pu.s-delivered{fill:rgba(59,130,246,.5);stroke:#1d4ed8}
.pu.s-placed{fill:rgba(34,197,94,.6);stroke:#15803d}
.pu.od{stroke:#dc2626;stroke-width:2.2}
.pu.sel{stroke:#0f1419;stroke-width:2.6;fill-opacity:.9}
.pu.dim{opacity:.15}
.plan-panel{margin-top:12px;position:sticky;bottom:12px;z-index:6;box-shadow:0 18px 50px -18px rgba(15,20,25,.35)}
.plan-panel .pp{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-start}
.plan-panel .pp>div{min-width:200px;flex:1 1 220px}
.plan-panel .pp .forms{flex:2 1 460px;display:flex;flex-wrap:wrap;gap:0 18px}.plan-panel .pp .forms>div{flex:1 1 220px}
.plan-dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.plan-dl dt{color:var(--mut)}.plan-dl dd{margin:0;font-weight:500}
</style>

const FIRST_MONTH = [2026, 10];      // november 2026: vast begin van het project
const MAX_MONTHS = 36;
let MON = [], TABS = ['Totaaloverzicht', 'Schepenlijst', 'Plattegrond'], SHIPS_TAB = 1, PLAN_TAB = 2;
// ISO-weeknummer (week begint op maandag, week 1 bevat de eerste donderdag van het jaar)
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y0 = Date.UTC(t.getUTCFullYear(), 0, 1);
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
const monthKey = (y, m) => y + '-' + String(m + 1).padStart(2, '0');

// Bepaalt de zichtbare maanden uit S.lastMonth (laatste maand), nooit korter dan de laatste maand met leveringen.
function applyMonths() {
  const idx = (y, m) => y * 12 + m;
  let last = /^\d{4}-\d{2}$/.test(S.lastMonth || '') ? idx(+S.lastMonth.slice(0, 4), +S.lastMonth.slice(5, 7) - 1) : idx(2027, 5);
  const maxD = S.deliveries.reduce((mx, d) => (d.date > mx ? d.date : mx), '');
  if (maxD) last = Math.max(last, idx(+maxD.slice(0, 4), +maxD.slice(5, 7) - 1));
  const first = idx(FIRST_MONTH[0], FIRST_MONTH[1]);
  last = Math.min(Math.max(last, first), first + MAX_MONTHS - 1);
  S.lastMonth = monthKey(Math.floor(last / 12), last % 12);
  MON = [];
  for (let k = first; k <= last; k++) MON.push([Math.floor(k / 12), k % 12]);
  TABS = ['Totaaloverzicht', ...MON.map(([y, m]) => MN[m] + ' ' + y), 'Schepenlijst', 'Plattegrond'];
  SHIPS_TAB = TABS.length - 2;

function normalize(st) {
  if (!/^\d{4}-\d{2}$/.test(st.lastMonth || '')) st.lastMonth = SNAP.lastMonth || '2027-06';
  if (!st.units || typeof st.units !== 'object' || Array.isArray(st.units)) st.units = {};
  st.deliveries.sort((a, b) => a.date.localeCompare(b.date));
  st.ships.forEach(s => {
    const d = SNAP.ships.find(x => x.id === s.id);
    if (!Object.prototype.hasOwnProperty.call(s, 'trackingUrl')) s.trackingUrl = d ? (d.trackingUrl || '') : '';
    if (!Object.prototype.hasOwnProperty.call(s, 'arrived')) s.arrived = d ? !!d.arrived : false;
    if (!Object.prototype.hasOwnProperty.call(s, 'departed')) s.departed = d ? !!d.departed : false;
    if (!Object.prototype.hasOwnProperty.call(s, 'mmsi')) s.mmsi = d ? (d.mmsi || '') : '';
    if (s.departed && !s.arrived) s.departed = false;
  });
  return st;
}

function fmtStamp(iso) {
  try {
    return new Date(iso).toLocaleString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.style.display = 'none', 4500);
}

const shipOf = id => S.ships.find(s => s.id == id);
const used = (f, ex) => sum(S.deliveries.filter(d => f(d) && d.id != ex));
const mUnits = i => {
  const [y, m] = MON[i];
  return sum(S.deliveries.filter(d => d.date.startsWith(y + '-' + p(m + 1))));

/* ---------- Shiptracking helpers ---------- */
function getShipDates(shipId) {
  const list = S.deliveries
    .filter(d => d.shipId === shipId)
    .map(d => d.date)
    .sort();
  if (!list.length) return { firstISO: null, firstLabel: '-', deadlineISO: null, deadlineLabel: '-' };

  const firstISO = list[0];
  const [y, m, d] = firstISO.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d - 7));
  const deadlineISO = `${dt.getUTCFullYear()}-${p(dt.getUTCMonth() + 1)}-${p(dt.getUTCDate())}`;

  return {
    firstISO,
    firstLabel: fmtDate(firstISO),
    deadlineISO,
    deadlineLabel: fmtDate(deadlineISO)
  };
}

function toggleArrival(id) {
  if (!ed()) return;
  const s = shipOf(id);
  if (!s) return;
  s.arrived = !s.arrived;
  if (!s.arrived) s.departed = false;
  save();
  render();
  toast(`${s.name}: ${s.arrived ? 'gemarkeerd als aangemeerd' : 'status teruggezet naar onderweg'}.`);
}

function toggleDeparture(id) {
  if (!ed()) return;
  const s = shipOf(id);
  if (!s) return;
  if (!s.arrived) {
    toast(`${s.name}: vink eerst Aangemeerd aan voordat je Vertrokken kunt kiezen.`);
    render();
    return;
  }
  s.departed = !s.departed;
  save();
  render();
  toast(`${s.name}: ${s.departed ? 'gelost en vertrokken uit Rotterdam' : 'status teruggezet naar aan de kade'}.`);
}

function toggleDone() {
  SHOW_DONE = !SHOW_DONE;
  render();
}

function renderArrivalPill(s, deadlineISO) {
  if (shipDone(s)) return `<span class="pill ok">Compleet geleverd</span>`;
  if (s.departed) return `<span class="pill ok">Vertrokken (gelost)</span>`;
  if (s.arrived) {
    return `<span class="pill ok">Aangemeerd</span>`;
  }
  const now = new Date(), todayISO = ds(now.getFullYear(), now.getMonth(), now.getDate());
  if (deadlineISO && todayISO > deadlineISO) {
    return `<span class="pill late">Niet aangemeerd (deadline verstreken)</span>`;
  }
  return `<span class="pill wait">Onderweg</span>`;
}

/* ---------- Buffer Maasvlakte: units van aangemeerde schepen die nog niet in Farmsum zijn geleverd ---------- */
function shipDone(s) {
  return s.cap > 0 && sum(S.deliveries.filter(d => d.shipId == s.id && d.status == 'Geleverd')) >= s.cap;
}

function bufferOf(s) {
  if (!s.arrived) return 0;
  return sum(S.deliveries.filter(d => d.shipId == s.id && d.status != 'Geleverd'));
}

/* ---------- Validatie ---------- */
function validate(x) {
  const e = [], u = +x.units;
  if (!Number.isInteger(u) || u < 1) e.push('Aantal units moet een positief geheel getal zijn.');
  const day = S.deliveries.filter(d => d.date == x.date && d.id != x.id);
  const sh2 = new Set(day.map(d => d.shipId));
  if (x.shipId) sh2.add(x.shipId);
  if (sh2.size > 2) e.push('Maximaal 2 scheepsladingen (verschillende schepen) per kalenderdag.');
  if (x.status == 'Gepland') {
    const planned = sum(day.filter(d => d.status == 'Gepland'));
    if (planned + u > DAILY_PLAN_LIMIT) e.push(`Planningslimiet: ${planned} + ${u} is meer dan ${DAILY_PLAN_LIMIT} geplande units op deze dag.`);
  }
  const sh = shipOf(x.shipId);
  if (!sh) e.push('Kies een schip.');
  else {
    const t = used(d => d.shipId == sh.id, x.id) + u;
    if (t > sh.cap) e.push(`${sh.name}: ${t} van ${sh.cap} units, capaciteit overschreden.`);
  }
  if (!HUT[x.hut]) e.push('Kies een veldhuisje.');
  else {
    const t = used(d => d.hut == x.hut, x.id) + u;
    if (t > HUT[x.hut]) e.push(`Veldhuisje ${x.hut}: ${t} van ${HUT[x.hut]} units, capaciteit overschreden.`);
  }
  return e;
}

/* ---------- Navigatie ---------- */
function go(i) {
  tab = i;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const prevShips = SHIPS_TAB, prevPlan = PLAN_TAB;
  applyMonths();
  if (tab === prevPlan && prevPlan !== PLAN_TAB) tab = PLAN_TAB;
  else if (tab === prevShips && prevShips !== SHIPS_TAB) tab = SHIPS_TAB;
  else if (tab > PLAN_TAB) tab = PLAN_TAB;
  const f = MON[0], l = MON[MON.length - 1];
  $('subTitle').textContent = `Leveringen GIGA Leopard, ${MN[f[1]].toLowerCase()} ${f[0]} t/m ${MN[l[1]].toLowerCase()} ${l[0]} · ${DIRTY ? 'niet gepubliceerd' : 'stand ' + fmtStamp(BASE)} · ${EDIT ? 'bewerken actief' : 'alleen lezen'}`;
  const lastKey = monthKey(l[0], l[1]);
  const canRemove = MON.length > 1 && !S.deliveries.some(d => d.date.startsWith(lastKey));
  $('nav').innerHTML = TABS.map((t, i) => {
    const n = i == 0 || i == PLAN_TAB ? 0 : i == SHIPS_TAB ? S.ships.length : mUnits(i - 1);
    return `<button class="tab ${i == tab ? 'on' : ''}" onclick="go(${i})">${t}${i == 0 || n <= 0 ? '' : `<span class="bd">${n}</span>`}</button>`;
  }).join('') + (EDIT ? `<button class="tab" title="Volgende maand toevoegen" onclick="addMonth()" ${MON.length >= MAX_MONTHS ? 'disabled' : ''}>+ maand</button><button class="tab" title="${canRemove ? 'Laatste maand verwijderen' : 'Alleen een lege laatste maand kan worden verwijderd'}" onclick="removeMonth()" ${canRemove ? '' : 'disabled'}>&minus; maand</button>` : '');
  $('main').innerHTML = tab == 0 ? dash() : tab == PLAN_TAB ? planV() : tab == SHIPS_TAB ? shipsV() : monthV(tab - 1);
  if (tab == PLAN_TAB) planMount();
}

function addMonth() {
  if (!ed()) return;
  if (MON.length >= MAX_MONTHS) return toast(`Maximaal ${MAX_MONTHS} maanden.`);
  const [y, m] = MON[MON.length - 1], k = y * 12 + m + 1;
  S.lastMonth = monthKey(Math.floor(k / 12), k % 12);
  save();
  render();
  go(SHIPS_TAB - 1);
  toast(`${MN[k % 12]} ${Math.floor(k / 12)} toegevoegd.`);
}

function removeMonth() {
  if (!ed()) return;
  if (MON.length <= 1) return toast('De eerste maand kan niet worden verwijderd.');
  const [y, m] = MON[MON.length - 1], key = monthKey(y, m);
  const n = S.deliveries.filter(d => d.date.startsWith(key)).length;
  if (n) return toast(`${MN[m]} ${y} heeft nog ${n} ${n === 1 ? 'levering' : 'leveringen'}. Verplaats of verwijder die eerst.`);
  if (!confirm(`${MN[m]} ${y} verwijderen?`)) return;
  const k = y * 12 + m - 1;
  S.lastMonth = monthKey(Math.floor(k / 12), k % 12);
  save();
  render();
  toast(`${MN[m]} ${y} verwijderd.`);
}

const bar = (a, b, max, c) => `<div class="bar"><i style="width:${a / max * 100}%;background:${c}"></i><i style="width:${b / max * 100}%;background:${c};opacity:.45"></i></div>`;

/* ---------- Maandkalender ---------- */
function monthV(i) {
  const [y, m] = MON[i], last = new Date(y, m + 1, 0), pre = y + '-' + p(m + 1);
  const md = S.deliveries.filter(d => d.date.startsWith(pre)), by = s => sum(md.filter(d => d.status == s));
  const st = new Date(y, m, 1);
  st.setDate(1 - ((st.getDay() + 6) % 7));
  let rows = '';

  for (let w = new Date(st); w <= last; w.setDate(w.getDate() + 7)) {
    let cells = '', any = false, wd = [];
    for (let k = 0; k < 5; k++) {
      const d = new Date(w);
      d.setDate(w.getDate() + k);
      if (d.getMonth() != m) {
        cells += '<td class="empty"></td>';
        continue;
      }
      any = true;
      const key = ds(y, m, d.getDate());
      const dl = S.deliveries.filter(x => x.date == key);
      wd.push(...dl);
      cells += `<td>
        <div class="dn">
          <span><b>${d.getDate()}</b>${dl.length ? ` &nbsp;${sum(dl)}/8 units` : ''}</span>
          ${EDIT && sum(dl) < 8 ? `<span class="add noprint" title="Levering toevoegen" onclick="openM('${key}')">+</span>` : ''}
        </div>
        ${dl.map(card).join('')}
      </td>`;
    }
    if (!any) continue;
    const wk = isoWeek(w), t = sum(wd), g = sum(wd.filter(x => x.status == 'Geleverd'));
    rows += `<tr><td class="wk" title="Week ${wk}"><span class="wkl">wk</span><b>${wk}</b></td>${cells}<td style="background:color-mix(in srgb,var(--acc) 8%,var(--card))">
      <b style="font-size:20px">${t}</b> units
      <div class="text-xs" style="color:var(--ok)">Geleverd ${g}</div>
      <div class="text-xs" style="color:var(--mut)">Gepland ${t - g}</div>
    </td></tr>`;
  }

  const sm = [
    ['Leverdagen', new Set(md.map(d => d.date)).size],
    ['Gepland', by('Gepland')],
    ['Bevestigd', by('Bevestigd')],
    ['Geleverd', by('Geleverd')],
    ['Maandtotaal', sum(md)]
  ];

  return `<h1>${MN[m]} ${y}</h1>
  <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-3">${sm.map(s => `<div class="card p-2 kpi"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>
  <div class="mb-3 flex flex-wrap gap-x-4 gap-y-1 text-xs" style="color:var(--mut)">${Object.keys(BL).map(b => `<span><i class="sw" style="background:${BL[b].c}"></i>Blok ${b}</span>`).join('')}</div>
  <div class="overflow-x-auto"><table class="cal card"><thead><tr>${['Wk','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Weektotaal'].map(h => `<th${h === 'Wk' ? ' class="wk"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function card(d) {
  const s = shipOf(d.shipId), b = HB[d.hut];
  const mooredTag = s && s.arrived ? ` <span title="${s.departed ? 'Schip is gelost en vertrokken' : 'Schip is aangemeerd'}" style="color:var(--ok);font-weight:600">&bull; ${s.departed ? 'Gelost' : 'Aangemeerd'}</span>` : '';
  return `<div class="dc" style="--c:${b ? BL[b].c : '#888'}" onclick="openM('${d.date}','${d.id}')">
    <b>${d.units} units</b> &middot; ${s ? esc(s.name) : '?'}${mooredTag}<br>
    ${d.hut} &middot; ${b || ''}
    <button class="st ${d.status}" title="Status doorzetten" onclick="event.stopPropagation();adv('${d.id}')">${d.status}</button>
  </div>`;
}

function adv(id) {
  if (!ed()) return;
  const d = S.deliveries.find(x => x.id == id);

/* ---------- Invoermodal ---------- */
function openM(date, id) {
  if (!ed()) return;
  const d = id ? S.deliveries.find(x => x.id == id) : { id: null, date, units: 1, shipId: '', hut: '', status: 'Gepland' };
  M = d;
  const so = S.ships.map(s => `<option value="${s.id}" ${s.id == d.shipId ? 'selected' : ''}>${esc(s.name)} (vrij ${s.cap - used(x => x.shipId == s.id, d.id)} van ${s.cap}${s.departed ? ' · gelost' : s.arrived ? ' · aangemeerd' : ''})</option>`).join('');
  const ho = Object.keys(BL).map(b => `<optgroup label="Blok ${b}">${Object.keys(BL[b].h).map(h => `<option value="${h}" ${h == d.hut ? 'selected' : ''}>${h} (bezet ${used(x => x.hut == h, d.id)} van ${HUT[h]})</option>`).join('')}</optgroup>`).join('');

  $('modal').innerHTML = `<div class="card p-5 w-full" style="max-width:460px">
    <h2 class="text-lg font-bold mb-3" style="text-transform:none;letter-spacing:0;color:var(--fg)">${id ? 'Levering bewerken' : 'Levering plannen'} &middot; ${fmtDate(d.date)}</h2>
    <div class="grid gap-3" oninput="chk()" onchange="chk()">
      <label class="text-xs" style="color:var(--mut)">Aantal BESS-units<input id="fu" type="number" min="1" step="1" value="${d.units}" class="mt-1"></label>
      <label class="text-xs" style="color:var(--mut)">Schip<select id="fs" class="mt-1"><option value="">Kies een schip</option>${so}</select></label>
      <label class="text-xs" style="color:var(--mut)">Bestemd veldhuisje<select id="fh" class="mt-1"><option value="">Kies een veldhuisje</option>${ho}</select></label>
      <label class="text-xs" style="color:var(--mut)">Status<select id="ft" class="mt-1">${ST.map(s => `<option ${s == d.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    </div>
    <div id="info" class="text-xs mt-3 grid gap-1"></div>
    <div class="flex gap-2 mt-4">
      <button id="sv" class="btn pri" onclick="saveM()">Opslaan</button>
      <button class="btn" onclick="closeM()">Annuleren</button>
      ${id ? `<button class="btn del ml-auto" onclick="delM()">Verwijderen</button>` : ''}
    </div>
  </div>`;
  $('modal').classList.add('on');
  chk();
}

const closeM = () => $('modal').classList.remove('on');
function val() {
  return { id: M.id, date: M.date, units: $('fu').value, shipId: $('fs').value, hut: $('fh').value, status: $('ft').value };
}

function chk() {
  const x = val(), e = validate(x), u = +x.units || 0, sh = shipOf(x.shipId), day = S.deliveries.filter(d => d.date == x.date && d.id != x.id);
  const ss = new Set(day.map(d => d.shipId));
  if (x.shipId) ss.add(x.shipId);
  const statusDay = sum(day.filter(d => d.status == x.status)) + u;
  const dayInfo = x.status == 'Gepland'
    ? `Gepland op deze dag: ${statusDay} van ${DAILY_PLAN_LIMIT} units`
    : `${x.status} op deze dag: ${statusDay} units (geen vaste daglimiet)`;
  const l = [dayInfo, `${ss.size} van 2 scheepsladingen op deze dag`];
  if (sh) {
    const dtInfo = getShipDates(sh.id);
    l.push(`Schip ${esc(sh.name)}: ${used(d => d.shipId == sh.id, x.id) + u} van ${sh.cap} units (${sh.departed ? 'gelost en vertrokken' : sh.arrived ? 'aangemeerd' : 'uiterste aanmeerdatum ' + dtInfo.deadlineLabel})`);
  }
  if (HUT[x.hut]) l.push(`Veldhuisje ${x.hut} (Blok ${HB[x.hut]}): ${used(d => d.hut == x.hut, x.id) + u} van ${HUT[x.hut]} units`);
  $('info').innerHTML = l.map(t => `<div style="color:var(--mut)">${t}</div>`).join('') + e.map(t => `<div style="color:var(--bad);font-weight:600">${t}</div>`).join('');
  $('sv').disabled = e.length > 0;
}

function saveM() {
  const x = val();
  if (validate(x).length) return;
  x.units = +x.units;
  if (x.id) Object.assign(S.deliveries.find(d => d.id == x.id), x);
  else { x.id = uid(); S.deliveries.push(x); }
  save(); closeM(); render();
}

function delM() {
  if (!confirm('Deze levering verwijderen?')) return;
  S.deliveries = S.deliveries.filter(d => d.id != M.id);
  save(); closeM(); render();
}

function expCSVTab() {
  if (tab == PLAN_TAB) return planCSV();
  const sn = id => shipOf(id)?.name || '';
  let rows;
  if (tab >= 1 && tab < SHIPS_TAB) {
    const [y, m] = MON[tab - 1], pre = y + '-' + p(m + 1);
    rows = [['Datum','Schip','Veldhuisje','Blok','Units','Status'], ...S.deliveries.filter(d => d.date.startsWith(pre)).sort((a, b) => a.date.localeCompare(b.date)).map(d => [d.date, sn(d.shipId), d.hut, HB[d.hut] || '', d.units, d.status])];
  } else if (tab == SHIPS_TAB) {
    rows = [['Schip','Capaciteit','Ingepland','Geleverd','Eerste levering','Uiterste aanmeerdatum','Aangemeerd','Vertrokken (gelost)','Buffer Maasvlakte','MarineTraffic'], ...S.ships.map(s => {
      const f = S.deliveries.filter(d => d.shipId == s.id), t = sum(f), g = sum(f.filter(d => d.status == 'Geleverd')), dtInfo = getShipDates(s.id);
      return [s.name, s.cap, t - g, g, dtInfo.firstLabel, dtInfo.deadlineLabel, s.arrived ? 'Ja' : 'Nee', s.departed ? 'Ja' : 'Nee', bufferOf(s), s.trackingUrl || ''];
    })];
  } else {
    rows = [['Maand','Leverdagen','Gepland','Bevestigd','Geleverd','Maandtotaal'], ...MON.map(([y, m]) => {
      const md = S.deliveries.filter(d => d.date.startsWith(y + '-' + p(m + 1))), b = s => sum(md.filter(d => d.status == s));
      return [MN[m] + ' ' + y, new Set(md.map(d => d.date)).size, b('Gepland'), b('Bevestigd'), b('Geleverd'), sum(md)];
    })];
  }
  dl('bess-' + TABS[tab].toLowerCase().replace(/\s+/g, '-') + '.csv', new Blob(['\ufeff' + rows.map(r => r.join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
}

/* ---------- Delen via GitHub ---------- */
const GH_API = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
const ghHeaders = t => ({ 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + t, 'X-GitHub-Api-Version': '2022-11-28' });
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const AUTO_KEY = 'bess-autopub';
const autoOn = () => { try { return localStorage.getItem(AUTO_KEY) !== '0'; } catch (e) { return true; } };
let PUBLISHING = false, AP_T = null, REV = 0;
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };

function renderDraftBar() {
  const bar = $('draftBar');
  bar.hidden = !DIRTY;
  if (!DIRTY) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<div class="draftbar">
    <div class="text-sm"><b>Niet-gepubliceerde wijzigingen.</b> ${REMOTE_NEWER ? 'Er staat een nieuwere planning op GitHub; jouw lokale wijzigingen staan daar nog overheen.' : 'Deze wijzigingen staan alleen in jouw browser, collega&rsquo;s zien ze niet.'}</div>
    <button class="btn" onclick="discardDraft()">${REMOTE_NEWER ? 'Verwerp mijn wijzigingen en laad de nieuwste' : 'Verwerp mijn wijzigingen'}</button>
  </div>`;
}

function updatePublishUI() {
  const show = EDIT && DIRTY;
  $('pubBtn').hidden = !show;
  $('discBtn').hidden = !DIRTY;
  renderDraftBar();
  $('tokWrap').hidden = !EDIT;
  $('autoLbl').textContent = autoOn() ? 'aan' : 'uit';
  $('pubBtn').title = REMOTE_NEWER ? 'Let op: er staat een nieuwere planning op GitHub' : 'Wijzigingen publiceren naar GitHub';
}

async function loadRemote(manual) {
  let r;
  try {
    const res = await fetch(`${GH.path}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    r = await res.json();
  } catch (e) {
    if (manual) toast('Kon de gedeelde planning niet laden.');
    return;
  }
  if (!r || !Array.isArray(r.ships) || !Array.isArray(r.deliveries) || !r.updatedAt) return;
  LAST_REMOTE = r;
  if (r.updatedAt <= BASE) return;
  if (DIRTY) {
    if (!REMOTE_NEWER) toast('Er staat een nieuwere planning op GitHub. Zie de melding bovenaan om jouw wijzigingen te verwerpen.');
    REMOTE_NEWER = true;
    updatePublishUI();
    return;
  }
  if ($('modal').classList.contains('on')) return;
  S = normalize({ ships: r.ships, deliveries: r.deliveries, lastMonth: r.lastMonth, units: r.units });
  BASE = r.updatedAt;
  render();
  toast('Planning bijgewerkt (stand ' + fmtStamp(BASE) + ').');
}

function scheduleAutoPublish() {
  clearTimeout(AP_T);
  if (!EDIT || !DIRTY || !autoOn() || !getToken()) return;
  AP_T = setTimeout(() => publish(true), 2500);
}

function toggleAuto() {
  try { localStorage.setItem(AUTO_KEY, autoOn() ? '0' : '1'); } catch (e) {}
  updatePublishUI();
  toast(autoOn() ? 'Automatisch publiceren staat aan.' : 'Automatisch publiceren staat uit. Gebruik de knop Publiceer.');
  scheduleAutoPublish();
}

async function publish(auto) {
  if (auto !== true) auto = false;
  if (!ed()) return;
  const token = getToken();
  if (!token) { if (!auto) tokenDlg(true); return; }
  if (PUBLISHING) { if (auto) scheduleAutoPublish(); return; }
  PUBLISHING = true;
  const btn = $('pubBtn');
  btn.disabled = true;
  try {
    let sha;
    const g = await fetch(`${GH_API}?ref=${GH.branch}&t=${Date.now()}`, { headers: ghHeaders(token), cache: 'no-store' });
    if (g.status === 401 || g.status === 403) { toast('GitHub weigert het token. Controleer of het niet verlopen is en schrijfrechten (Contents) heeft.'); if (!auto) tokenDlg(true); return; }
    if (g.ok) {
      const j = await g.json();
      sha = j.sha;
      try {
        const cur = JSON.parse(b64dec(j.content));
        if (cur.updatedAt && cur.updatedAt > BASE) {
          if (auto) {
            REMOTE_NEWER = true;
            updatePublishUI();
            toast('Automatisch publiceren gepauzeerd: er staat een nieuwere planning op GitHub. Klik op Publiceer om te kiezen.');
            return;
          }
          if (!confirm('Er is intussen een nieuwere planning gepubliceerd (' + fmtStamp(cur.updatedAt) + '). Als je doorgaat, overschrijft jouw versie die. Doorgaan?')) return;
        }
      } catch (e) {}
    } else if (g.status !== 404) {
      throw new Error('Ophalen mislukt (' + g.status + ')');
    }
    const stamp = new Date().toISOString();
    const rev = REV;
    const body = {
      message: 'Planning bijgewerkt ' + fmtStamp(stamp),
      branch: GH.branch,
      content: b64enc(JSON.stringify({ updatedAt: stamp, lastMonth: S.lastMonth, ships: S.ships, deliveries: S.deliveries, units: S.units }, null, 2) + '\n')
    };
    if (sha) body.sha = sha;
    const p = await fetch(GH_API, { method: 'PUT', headers: { ...ghHeaders(token), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (p.status === 401 || p.status === 403) { toast('Publiceren niet toegestaan (' + p.status + '). Controleer de rechten van je token.'); if (!auto) tokenDlg(true); return; }
    if (p.status === 409 || p.status === 422) { toast('Publiceren botste met een andere wijziging. Probeer het opnieuw.'); return; }
    if (!p.ok) throw new Error('Publiceren mislukt (' + p.status + ')');
    BASE = stamp;
    REMOTE_NEWER = false;
    if (REV === rev) {
      DIRTY = false;
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    } else {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: BASE, state: S })); } catch (e) {}
      scheduleAutoPublish();
    }
    render();
    updatePublishUI();
    toast('Gepubliceerd. Collega’s zien de nieuwe planning binnen enkele minuten.');
  } catch (e) {
    toast('Publiceren mislukt: ' + ((e && e.message) || e));
  } finally {
    PUBLISHING = false;
    btn.disabled = false;
  }
}

function discardDraft() {
  if (!confirm('Alle niet-gepubliceerde wijzigingen verwerpen?')) return;
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  const src = LAST_REMOTE && LAST_REMOTE.updatedAt > SNAP.updatedAt ? LAST_REMOTE : SNAP;
  S = normalize(clone({ ships: src.ships, deliveries: src.deliveries, lastMonth: src.lastMonth, units: src.units }));
  BASE = src.updatedAt;
  DIRTY = false;
  REMOTE_NEWER = false;
  render();
  updatePublishUI();
  toast('Wijzigingen verworpen.');
  loadRemote();
}

function tokenDlg(thenPublish) {
  const has = !!getToken();
  $('modal').innerHTML = `<div class="card p-5 w-full" style="max-width:480px">
    <h2 class="text-lg font-bold mb-2" style="text-transform:none;letter-spacing:0;color:var(--fg)">GitHub-token</h2>
    <p class="mb-2 text-sm" style="color:var(--mut)">Om te publiceren heeft deze pagina een persoonlijk toegangstoken van GitHub nodig. Het wordt alleen in deze browser bewaard.</p>
    <ol class="mb-3 text-sm list-decimal pl-5" style="color:var(--mut)">
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--fg);text-decoration:underline">GitHub, nieuw token</a>.</li>
      <li>Kies bij <b>Repository access</b> alleen <b>${esc(GH.repo)}</b>.</li>
      <li>Zet bij <b>Permissions, Repository</b> de optie <b>Contents</b> op <b>Read and write</b>.</li>
      <li>Kies een vervaldatum, maak het token aan en plak het hieronder.</li>
    </ol>
    <input id="ghTok" type="password" autocomplete="off" placeholder="github_pat_...">
    <div id="ghErr" class="text-sm mt-2" style="color:var(--bad)"></div>
    <div class="flex flex-wrap gap-2 mt-4">
      <button class="btn pri" onclick="saveToken(${thenPublish ? 'true' : 'false'})">Opslaan en testen</button>
      ${has ? '<button class="btn del" onclick="clearToken()">Token verwijderen</button>' : ''}
      <button class="btn" onclick="closeM()">Annuleren</button>
    </div>
  </div>`;
  $('modal').classList.add('on');
  $('ghTok').focus();
}

async function saveToken(thenPublish) {
  const t = $('ghTok').value.trim();
  if (!t) { $('ghErr').textContent = 'Plak eerst een token.'; return; }
  $('ghErr').textContent = 'Testen…';
  try {
    const res = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`, { headers: ghHeaders(t) });
    if (!res.ok) { $('ghErr').textContent = res.status === 401 ? 'Token ongeldig of verlopen.' : `GitHub antwoordde met ${res.status}. Controleer of het token toegang heeft tot ${GH.repo}.`; return; }
    const j = await res.json();
    if (j.permissions && j.permissions.push === false) { $('ghErr').textContent = 'Dit token heeft alleen leesrechten. Zet Contents op Read and write.'; return; }
  } catch (e) { $('ghErr').textContent = 'Kon GitHub niet bereiken.'; return; }
  try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { $('ghErr').textContent = 'Token kon niet worden bewaard in deze browser.'; return; }
  closeM();
  toast('Token opgeslagen.');
  if (thenPublish) publish();
}

function clearToken() {
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  closeM();
  toast('Token verwijderd uit deze browser.');
}

/* ---------- AIS-tracking (gevuld door de geplande GitHub-taak) ---------- */
const TRACK_URL = `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/tracking/tracking.json`;
let TRACK = null;

async function loadTrack() {
  try {
    const res = await fetch(`${TRACK_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const j = await res.json();
    if (!j || !j.vessels) return;
    const changed = !TRACK || TRACK.updatedAt !== j.updatedAt;
    TRACK = j;
    if (changed && (tab === 0 || tab === SHIPS_TAB) && !$('modal').classList.contains('on')) render();
  } catch (e) {}
}

const NAV_STATUS = { 0: 'Onderweg', 1: 'Voor anker', 2: 'Niet bestuurbaar', 3: 'Beperkt manoeuvreerbaar', 4: 'Beperkt door diepgang', 5: 'Afgemeerd', 6: 'Aan de grond', 7: 'Vissend', 8: 'Zeilend' };
const inRotterdam = v => v.lat >= 51.84 && v.lat <= 52.02 && v.lon >= 3.80 && v.lon <= 4.45;

function agoText(iso) {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!Number.isFinite(m)) return '';
  if (m < 1) return 'zojuist';
  if (m < 60) return `${m} min geleden`;
  const hr = Math.round(m / 60);
  return hr < 48 ? `${hr} u geleden` : `${Math.round(hr / 24)} d geleden`;
}

function trackCell(s, deadlineISO) {
  const dim = t => `<span class="text-xs" style="color:var(--mut)">${t}</span>`;
  if (!s.mmsi) return dim('Geen MMSI');
  const v = TRACK && TRACK.vessels && TRACK.vessels[s.mmsi];
  if (!v || typeof v.lat !== 'number') return dim('Nog geen signaal');
  const port = inRotterdam(v), still = v.sog == null || v.sog < 1;
  const stale = Date.now() - new Date(v.positionAt).getTime() > 12 * 3600e3;
  const status = port ? 'In havengebied Rotterdam' : (NAV_STATUS[v.navStatus] || (still ? 'Stilliggend' : 'Onderweg'));
  const pos = `${Math.abs(v.lat).toFixed(2)}°${v.lat >= 0 ? 'N' : 'S'} ${Math.abs(v.lon).toFixed(2)}°${v.lon >= 0 ? 'E' : 'W'}`;
  const map = `https://www.openstreetmap.org/?mlat=${v.lat}&mlon=${v.lon}#map=6/${v.lat}/${v.lon}`;
  const etaLate = !s.arrived && v.eta && deadlineISO && v.eta.slice(0, 10) > deadlineISO;
  return `<div class="font-medium">${status}</div>
    <div class="text-xs" style="color:var(--mut)">${pos}${v.sog != null ? ' · ' + v.sog.toFixed(1) + ' kn' : ''} · <a href="${map}" target="_blank" rel="noopener noreferrer" style="color:var(--acc);text-decoration:underline">kaart &nearr;</a></div>
    <div class="text-xs" style="color:${stale ? 'var(--warn)' : 'var(--mut)'}">${agoText(v.positionAt)}${stale ? ' (verouderd)' : ''}</div>
    ${v.destination ? `<div class="text-xs">Naar ${esc(v.destination)}${v.eta ? ' · ETA ' + fmtDate(v.eta.slice(0, 10)) : ''}</div>` : ''}
    ${etaLate ? '<span class="pill late">ETA na uiterste aanmeerdatum</span>' : ''}
    ${port && !s.arrived && still ? (EDIT ? `<button class="btn mt-1" onclick="toggleArrival('${s.id}')">Markeer als aangemeerd</button>` : '<span class="pill wait">Lijkt aangemeerd</span>') : ''}`;
}

/* ---------- Plattegrond: BESS-units volgen (geleverd en plaatsing) ---------- */
const PLAN_VB = [220, 110, 3030, 1090];

const planToday = () => { const n = new Date(); return ds(n.getFullYear(), n.getMonth(), n.getDate()); };
function unitState(id) {
  const u = S.units[id];

}

function planBBox(us) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  us.forEach(u => { x0 = Math.min(x0, u.x); y0 = Math.min(y0, u.y); x1 = Math.max(x1, u.x + u.w); y1 = Math.max(y1, u.y + u.h); });
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

/* --- viewer: zoom en verschuiven via de viewBox van een SVG --- */
function planSize() { const r = PV.root.getBoundingClientRect(); return { W: Math.max(r.width, 1), H: Math.max(r.height, 1), left: r.left, top: r.top }; }
function planVH() { const { W, H } = planSize(); return PV.vb.w * H / W; }
function planApply() { PV.svg.setAttribute('viewBox', `${PV.vb.x} ${PV.vb.y} ${PV.vb.w} ${planVH()}`); }
function planFitW() { const { W, H } = planSize(); return Math.max(PLAN_VB[2], PLAN_VB[3] * W / H); }
function planClamp() {
  PV.vb.w = Math.min(Math.max(PV.vb.w, 30), planFitW() * 1.1);
  const h = planVH();
  PV.vb.x = Math.min(Math.max(PV.vb.x, PLAN_VB[0] - PV.vb.w * 0.5), PLAN_VB[0] + PLAN_VB[2] - PV.vb.w * 0.5);
  PV.vb.y = Math.min(Math.max(PV.vb.y, PLAN_VB[1] - h * 0.5), PLAN_VB[1] + PLAN_VB[3] - h * 0.5);
}
function planSchedule() { if (PV.raf) return; PV.raf = requestAnimationFrame(() => { PV.raf = 0; planClamp(); planApply(); }); }
function planFit() {
  const w = planFitW();
  PV.vb.w = w;
  PV.vb.x = PLAN_VB[0] + (PLAN_VB[2] - w) / 2;
  PV.vb.y = PLAN_VB[1] + (PLAN_VB[3] - planVH()) / 2;
  planApply();
}
function planToRect(r, pad = 0.2) {
  const { W, H } = planSize();
  const w = Math.max(r.w * (1 + 2 * pad), r.h * (1 + 2 * pad) * W / H);
  PV.vb.w = w;
  PV.vb.x = r.x + r.w / 2 - w / 2;
  PV.vb.y = r.y + r.h / 2 - planVH() / 2;
  planClamp();
  planApply();
}
function planZoomBy(f, cx, cy) {
  const { W, H, left, top } = planSize();
  const px = cx == null ? W / 2 : cx - left, py = cy == null ? H / 2 : cy - top;
  const s = PV.vb.w / W, ux = PV.vb.x + px * s, uy = PV.vb.y + py * s;
  const nw = Math.min(Math.max(PV.vb.w / f, 30), planFitW() * 1.1), s2 = nw / W;
  PV.vb.w = nw;
  PV.vb.x = ux - px * s2;
  PV.vb.y = uy - py * s2;
  planClamp();
  planApply();
}
function planClientToUser(cx, cy) { const { W, left, top } = planSize(); const s = PV.vb.w / W; return { x: PV.vb.x + (cx - left) * s, y: PV.vb.y + (cy - top) * s }; }

function planBuild() {

  PLAN_UNITS.forEach(u => {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', u.x); r.setAttribute('y', u.y); r.setAttribute('width', u.w); r.setAttribute('height', u.h);

  svg.appendChild(g);

function planBind() {

    PV.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (PV.ptrs.size === 1) {
      const t = e.target.closest ? e.target.closest('.pu') : null;
      const add = e.shiftKey || e.ctrlKey || e.metaKey || PV.tool === 'box';
      PV.drag = { x0: e.clientX, y0: e.clientY, moved: false, unit: t ? t.dataset.id : null, box: PV.tool === 'box' || e.shiftKey, add, vx: PV.vb.x, vy: PV.vb.y };
    } else if (PV.ptrs.size === 2) {
      const [a, b] = [...PV.ptrs.values()];
      PV.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), w: PV.vb.w };
      if (PV.drag) PV.drag.moved = true;
    }
  });
  root.addEventListener('pointermove', e => {
    if (!PV.ptrs.has(e.pointerId)) return;
    PV.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (PV.ptrs.size >= 2 && PV.pinch) {
      const [a, b] = [...PV.ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      planZoomBy(PV.vb.w / (PV.pinch.w * PV.pinch.d / d), (a.x + b.x) / 2, (a.y + b.y) / 2);
      return;
    }
    const dr = PV.drag;
    if (!dr) return;
    const dx = e.clientX - dr.x0, dy = e.clientY - dr.y0;
    if (!dr.moved && Math.hypot(dx, dy) > 5) dr.moved = true;
    if (!dr.moved) return;
    if (dr.box) {
      const { left, top } = planSize();
      Object.assign(PV.box.style, { left: Math.min(dr.x0, e.clientX) - left + 'px', top: Math.min(dr.y0, e.clientY) - top + 'px', width: Math.abs(dx) + 'px', height: Math.abs(dy) + 'px' });
      PV.box.hidden = false;
    } else {
      const s = PV.vb.w / planSize().W;
      PV.vb.x = dr.vx - dx * s;
      PV.vb.y = dr.vy - dy * s;
      planSchedule();
    }
  });
  const end = e => {
    if (!PV.ptrs.has(e.pointerId)) return;
    PV.ptrs.delete(e.pointerId);
    try { root.releasePointerCapture(e.pointerId); } catch (_) {}
    if (PV.ptrs.size < 2) PV.pinch = null;
    const dr = PV.drag;
    if (PV.ptrs.size === 0 && dr) {
      PV.drag = null;
      if (dr.box && dr.moved) {
        PV.box.hidden = true;
        const a = planClientToUser(dr.x0, dr.y0), b = planClientToUser(e.clientX, e.clientY);
        const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x), y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
        if (!dr.add) PV.sel.clear();
        PLAN_UNITS.forEach(u => { if (u.x < x1 && u.x + u.w > x0 && u.y < y1 && u.y + u.h > y0) PV.sel.add(u.id); });
        planSelChanged();
      } else if (!dr.moved && e.type === 'pointerup') {
        if (dr.unit) {
          if (dr.add) { if (PV.sel.has(dr.unit)) PV.sel.delete(dr.unit); else PV.sel.add(dr.unit); }
          else PV.sel = new Set([dr.unit]);
        } else if (!dr.add) PV.sel.clear();
        planSelChanged();
      }
    }
  };
  root.addEventListener('pointerup', end);
  root.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && tab === PLAN_TAB && PV.sel.size) planClearSel(); });

function planPaint() {
  PLAN_UNITS.forEach(u => {
    const el = PV.rects[u.id], st = unitState(u.id);
    let cls = 'pu s-' + st;
    if (unitOverdue(u.id)) cls += ' od';
    if (PV.sel.has(u.id)) cls += ' sel';
    if (PV.filter && PV.filter !== st) cls += ' dim';
    el.setAttribute('class', cls);
    el.firstChild.textContent = `${u.id} · ${planStateText(u.id)}`;
  });
}
function planSelChanged() {
  planPaint();
  const p = $('pvpanel');
  if (p) p.innerHTML = planPanel();
}
function planClearSel() { PV.sel.clear(); planSelChanged(); }
function planMount() {
  const m = $('pvmount');
  if (!m) return;
  if (!PV.root) planBuild();
  m.appendChild(PV.root);
  PV.root.classList.toggle('box', PV.tool === 'box');

/* --- acties --- */
function planFilter(k) { PV.filter = PV.filter === k ? null : k; render(); }
function planTool(t) { PV.tool = t; render(); }
function planGoto(h) {
  if (!h) return;
  planToRect(planBBox(PLAN_UNITS.filter(u => u.hut === h)), 0.25);
  const s = $('pvhut'); if (s) s.value = '';
}
function planSelectHut(h) {

  planGoto(h);

}
function planSelectDate(d) {
  const us = PLAN_UNITS.filter(u => { const x = S.units[u.id]; return x && x.p === d && !x.g; });
  if (!us.length) return;
  PV.sel = new Set(us.map(u => u.id));
  planToRect(planBBox(us), 0.3);
  planSelChanged();
  const m = $('pvmount'); if (m && m.scrollIntoView) m.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function planSearch(q) {
  q = (q || '').trim().toUpperCase();
  if (!q) return;
  const hits = PLAN_UNITS.filter(u => u.id.includes(q));
  if (!hits.length) return toast('Geen unit gevonden.');
  PV.sel = new Set(hits.map(u => u.id));
  planToRect(planBBox(hits), 0.3);
  planSelChanged();
}
function planSet(key, clear) {
  if (!ed()) return;
  const val = clear ? '' : (($('pv-' + key) || {}).value || '');
  if (!clear && !/^\d{4}-\d{2}-\d{2}$/.test(val)) return toast('Kies eerst een datum.');
  PV.sel.forEach(id => {
    const x = Object.assign({}, S.units[id]);
    if (val) { x[key] = val; if (key === 'g' && !x.d) x.d = val; } else delete x[key];
    if (Object.keys(x).length) S.units[id] = x; else delete S.units[id];
  });
  save();
  render();
  toast(`${PV.sel.size} ${PV.sel.size === 1 ? 'unit' : 'units'} bijgewerkt.`);
}
function planSyncDeliveries() {
  if (!ed()) return;
  let added = 0;
  PLAN_HUTS.forEach(h => {
    const dels = S.deliveries.filter(d => d.hut === h && d.status === 'Geleverd').sort((a, b) => a.date.localeCompare(b.date));
    const dates = [];
    dels.forEach(d => { for (let i = 0; i < d.units; i++) dates.push(d.date); });
    const us = PLAN_UNITS.filter(u => u.hut === h);
    let have = us.filter(u => S.units[u.id] && (S.units[u.id].d || S.units[u.id].g)).length;
    for (const u of us) {
      if (have >= dates.length) break;
      const x = S.units[u.id] || {};
      if (x.d || x.g) continue;
      S.units[u.id] = Object.assign({}, x, { d: dates[have] });
      have++; added++;
    }
  });
  if (!added) return toast('De tekening loopt al gelijk met de leveringen.');
  save();
  render();
  toast(`${added} units als geleverd gemarkeerd op basis van de leveringen.`);
}
function planRows() {
  const f = v => v ? fmtDate(v) : '';
  return PLAN_UNITS.map(u => { const x = S.units[u.id] || {}; return [u.id, u.hut, u.blok, f(x.d), f(x.p), f(x.g), PLAN_STATES.find(s => s[0] === unitState(u.id))[1]]; });
}
function planCSV() {
  const rows = [['Unit', 'Veldhuisje', 'Blok', 'Geleverd', 'Plaatsing gepland', 'Geplaatst', 'Status'], ...planRows()];
  dl('bess-units.csv', new Blob(['\ufeff' + rows.map(r => r.join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
}

function planHutCard(h) {
  const us = PLAN_UNITS.filter(u => u.hut === h), n = us.length;
  let pl = 0, dl = 0, pp = 0;
  us.forEach(u => { const x = S.units[u.id] || {}; if (x.g) pl++; if (x.d || x.g) dl++; if (x.p && !x.g) pp++; });
  const fromDel = S.deliveries.filter(d => d.hut === h && d.status === 'Geleverd').reduce((t, d) => t + d.units, 0);
  return `<div class="card p-3">
    <div class="flex justify-between items-center"><b>${h}</b><span class="text-xs" style="color:var(--mut)">Blok ${PLAN_BLOK[h]}</span></div>
    <div class="my-2">${bar(pl, Math.max(dl - pl, 0), n, BL[PLAN_BLOK[h]].c)}</div>
    <div class="text-xs" style="color:var(--mut)">Geplaatst ${pl} · Geleverd ${dl} van ${n}${pp ? ` · ${pp} gepland` : ''}</div>
    ${fromDel !== dl ? `<div class="text-xs" style="color:var(--warn)">Leveringen: ${fromDel} geleverd</div>` : ''}
    <div class="flex gap-2 mt-2"><button class="btn" onclick="planGoto('${h}')">Toon</button><button class="btn" onclick="planSelectHut('${h}')">Selecteer alles</button></div>
  </div>`;
}
function planAgenda() {
  const by = {};
  PLAN_UNITS.forEach(u => { const x = S.units[u.id]; if (x && x.p && !x.g) (by[x.p] = by[x.p] || []).push(u); });
  const dates = Object.keys(by).sort();
  if (!dates.length) return `<p class="text-sm mb-5" style="color:var(--mut)">Nog geen plaatsing gepland. Selecteer units op de tekening en kies bij &ldquo;Plaatsing gepland op&rdquo; een datum.</p>`;
  const today = planToday();
  return `<div class="card overflow-x-auto mb-5"><table><thead><tr><th>Geplaatst op</th><th>Units</th><th>Veldhuisjes</th><th>Geleverd</th><th></th></tr></thead><tbody>${dates.map(d => {
    const us = by[d], huts = [...new Set(us.map(u => u.hut))].join(', '), dlv = us.filter(u => S.units[u.id].d).length;
    return `<tr><td class="font-medium">${fmtDate(d)}${d < today ? ' <span class="text-xs" style="color:var(--bad)">verstreken</span>' : ''}</td><td><b>${us.length}</b></td><td>${huts}</td><td>${dlv} van ${us.length}${dlv < us.length ? ' <span class="text-xs" style="color:var(--warn)">nog niet alles geleverd</span>' : ''}</td><td><button class="btn" onclick="planSelectDate('${d}')">Toon</button></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function planPanel() {
  const ids = [...PV.sel];
  const sync = EDIT ? `<button class="btn mt-3" onclick="planSyncDeliveries()" title="Markeert per veldhuisje de eerste units als geleverd, passend bij de leveringen">Geleverd invullen vanuit leveringen</button>` : '';
  if (!ids.length) return `<div class="pp"><div><h3 class="font-semibold mb-1">Geen selectie</h3>

      <dl class="plan-dl text-sm"><dt>Geleverd</dt><dd>${x.d ? fmtDate(x.d) : '-'}</dd><dt>Plaatsing gepland</dt><dd>${x.p ? fmtDate(x.p) : '-'}${unitOverdue(id) ? ' <span style="color:var(--bad)">(verstreken)</span>' : ''}</dd><dt>Geplaatst</dt><dd>${x.g ? fmtDate(x.g) : '-'}</dd></dl>`;
  } else {

  } catch (e) { return ''; }

    <label class="flex-1 text-xs" style="min-width:240px;color:var(--mut)">MarineTraffic-link (optioneel)<input id="nt" type="url" placeholder="https://www.marinetraffic.com/..." class="mt-1"></label>
    <label class="text-xs" style="width:140px;color:var(--mut)">MMSI (optioneel)<input id="nm" inputmode="numeric" maxlength="9" placeholder="9 cijfers" class="mt-1"></label>
    <button class="btn pri" onclick="addShip()">Schip toevoegen</button>
  </div>`;
}

function trackShip(id) {
  if (!ed()) return;
  const input = $('track-' + id), v = input ? input.value.trim() : '', url = safeTrackUrl(v);
  if (v && !url) { toast('Vul een geldige http(s)-URL in.'); input?.focus(); return; }
  const s = shipOf(id);
  if (!s) return;
  const mIn = $('mmsi-' + id), mm = mIn ? mIn.value.trim() : '';
  if (mm && !/^\d{9}$/.test(mm)) { toast('Een MMSI bestaat uit precies 9 cijfers.'); mIn?.focus(); return; }
  s.trackingUrl = url;
  s.mmsi = mm;
  save(); render();
  toast('Schipgegevens opgeslagen.');
}

function addShip() {
  if (!ed()) return;
  const n = $('ns').value.trim(), c = +$('nc').value, t = $('nt').value.trim(), url = safeTrackUrl(t), nmv = $('nm').value.trim();
  if (!n || !(c >= 1)) return toast('Vul een naam en een capaciteit van minimaal 1 in.');
  if (t && !url) return toast('Vul een geldige http(s)-URL in.');
  if (nmv && !/^\d{9}$/.test(nmv)) return toast('Een MMSI bestaat uit precies 9 cijfers.');
  S.ships.push({ id: uid(), name: n, cap: Math.floor(c), trackingUrl: url, mmsi: nmv, arrived: false, departed: false });
  save(); render();
}

function renShip(id, v) {
  if (!ed()) return render();
  if (v.trim()) shipOf(id).name = v.trim();
  save(); render();
}

function capShip(id, v) {
  if (!ed()) return render();
  const s = shipOf(id), u = used(d => d.shipId == id);
  v = Math.floor(+v);
  if (!(v >= 1) || v < u) toast(`Capaciteit kan niet lager dan de ${u} ingeplande units.`);
  else s.cap = v;
  save(); render();
}

function delShip(id) {
  if (!ed()) return;
  const sh = shipOf(id);
  if (!sh || !confirm(`Schip ${sh.name} verwijderen?`)) return;
  S.ships = S.ships.filter(s => s.id != id);
  save(); render();
}

/* ---------- Dashboard ---------- */
function dash() {
  const tot = sum(S.deliveries), del = sum(S.deliveries.filter(d => d.status == 'Geleverd')), cap = S.ships.reduce((t, s) => t + s.cap, 0), days = new Set(S.deliveries.map(d => d.date)).size;
  const departed = S.ships.filter(s => s.departed).length, moored = S.ships.filter(s => s.arrived).length, buffer = S.ships.reduce((t, s) => t + bufferOf(s), 0);
  const k = [
    ['Totale projectbehoefte', NEED, 'units'],
    ['Totaal ingepland', tot, `${(tot / NEED * 100).toFixed(1)}% van de behoefte`],
    ['Daadwerkelijk geleverd', del, `${(del / NEED * 100).toFixed(1)}%`],
    ['Resterend te leveren', NEED - del, 'units'],
    ['Actieve leveringsdagen', days, 'dagen'],
    ['Buffer Maasvlakte', buffer, `units · ${moored} van ${S.ships.length} aangemeerd${departed ? `, ${departed} vertrokken` : ''}`]
  ];

  const mrows = MON.map(([y, m], i) => {
    const md = S.deliveries.filter(d => d.date.startsWith(y + '-' + p(m + 1))), b = s => sum(md.filter(d => d.status == s));

      <td>${b('Bevestigd')}</td>

  }).join('');

  const blocks = Object.keys(BL).map(b => {
    const f = S.deliveries.filter(d => HB[d.hut] == b), g = sum(f.filter(d => d.status == 'Geleverd')), t = sum(f), c = BCAP(b), col = BL[b].c;

    </div>`;
  }).join('');

  const huts = Object.keys(HUT).map(h => {
    const f = S.deliveries.filter(d => d.hut == h), g = sum(f.filter(d => d.status == 'Geleverd')), t = sum(f), col = BL[HB[h]].c;
    return `<div class="card p-3.5">
      <div class="flex justify-between mb-1.5"><b>${h}</b><span class="text-xs" style="color:var(--mut)">Blok ${HB[h]}</span></div>

    </div>`;
  }).join('');

  const overLimitDays = Object.values(S.deliveries.reduce((acc, d) => {
    const item = acc[d.date] || (acc[d.date] = { date: d.date, total: 0, planned: 0, confirmed: 0, delivered: 0 });
    item.total += d.units;
    if (d.status == 'Gepland') item.planned += d.units;
    else if (d.status == 'Bevestigd') item.confirmed += d.units;
    else if (d.status == 'Geleverd') item.delivered += d.units;
    return acc;
  }, {})).filter(d => d.total > DAILY_PLAN_LIMIT && d.delivered < d.total).sort((a, b) => a.date.localeCompare(b.date));
  const overLimitRows = overLimitDays.map(d => `<tr>
    <td class="font-medium">${fmtDate(d.date)}</td><td><b>${d.total}</b></td><td>${d.planned}</td><td>${d.confirmed}</td><td>${d.delivered}</td><td>${d.total - d.delivered}</td>
  </tr>`).join('');
  const doneCount = S.ships.filter(shipDone);
  const byDeadline = (a, b) => {
    const da = getShipDates(a.id).deadlineISO, db = getShipDates(b.id).deadlineISO;
    if (da && db) return da.localeCompare(db) || a.name.localeCompare(b.name);
    return da ? -1 : db ? 1 : a.name.localeCompare(b.name);
  };
  const nowD = new Date(), todayISO = ds(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
  const dayDiff = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO + 'T00:00:00')) / 86400000);
  const countdown = dd => dd > 1 ? `over ${dd} dagen` : dd === 1 ? 'morgen' : dd === 0 ? 'vandaag' : `${-dd} ${-dd === 1 ? 'dag' : 'dagen'} verstreken`;
  const nonLink = '<span class="text-xs" style="color:var(--mut)">Geen link</span>';
  const trackAge = TRACK && TRACK.updatedAt ? Date.now() - new Date(TRACK.updatedAt).getTime() : null;
  const trackNote = !TRACK
    ? 'Tracking-gegevens zijn nog niet geladen.'
    : `Tracking laatst gecontroleerd: ${fmtStamp(TRACK.updatedAt)} (${agoText(TRACK.updatedAt)}).${trackAge > 3 * 3600e3 ? ' <b style="color:var(--warn)">Dat is langer geleden dan verwacht: de tracking-taak draait mogelijk niet, recente posities kunnen ontbreken.</b>' : ''}`;

  /* Onderweg: nog niet aangemeerd, gericht op tracking */
  const onwayShips = S.ships.filter(s => !s.arrived).sort(byDeadline);
  const onway = onwayShips.map(s => {
    const dtInfo = getShipDates(s.id), url = safeTrackUrl(s.trackingUrl);
    const dd = dtInfo.deadlineISO ? dayDiff(dtInfo.deadlineISO) : null;
    return `<tr>
      <td class="font-medium">${esc(s.name)}</td>
      <td>${s.cap}</td>
      <td><div class="font-medium">${dtInfo.deadlineLabel}</div>${dd === null ? '' : `<div class="text-xs" style="color:${dd < 0 ? 'var(--bad)' : 'var(--mut)'}">${countdown(dd)}</div>`}</td>
      <td>${dtInfo.firstLabel}</td>
      <td>${renderArrivalPill(s, dtInfo.deadlineISO)}</td>
      <td style="min-width:220px">${trackCell(s, dtInfo.deadlineISO)}</td>
      <td>${url ? `<a class="btn inline-block" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Volg schip &nearr;</a>` : nonLink}</td>
    </tr>`;
  }).join('');
  const onwayFoot = onwayShips.length ? `<tfoot><tr><td class="font-medium">Totaal onderweg</td><td><b>${onwayShips.reduce((t, s) => t + s.cap, 0)}</b></td><td colspan="5"></td></tr></tfoot>` : '';

  /* Aangemeerd en/of gelost: status van de aanwezige BESS-units */
  const mooredShips = S.ships.filter(s => s.arrived && (SHOW_DONE || !shipDone(s))).sort(byDeadline);
  const mooredRows = mooredShips.map(s => {
    const f = S.deliveries.filter(d => d.shipId == s.id);
    const g = sum(f.filter(d => d.status == 'Geleverd')), t = sum(f);
    const open = f.filter(d => d.status != 'Geleverd').map(d => d.date).sort();
    const dtInfo = getShipDates(s.id);
    return `<tr>
      <td class="font-medium">${esc(s.name)}</td>
      <td>${renderArrivalPill(s, dtInfo.deadlineISO)}</td>
      <td>${s.cap}</td>
      <td><b>${bufferOf(s)}</b></td>
      <td>${g}</td>
      <td>${open.length ? fmtDate(open[0]) : '-'}</td>
      <td>${open.length ? fmtDate(open[open.length - 1]) : '-'}</td>
      <td style="width:22%">${bar(g, t - g, s.cap, 'var(--acc)')}</td>
    </tr>`;
  }).join('');
  const mooredFoot = mooredShips.length ? `<tfoot><tr><td class="font-medium">Totaal</td><td></td><td><b>${mooredShips.reduce((t, s) => t + s.cap, 0)}</b></td><td><b>${mooredShips.reduce((t, s) => t + bufferOf(s), 0)}</b></td><td><b>${mooredShips.reduce((t, s) => t + sum(S.deliveries.filter(d => d.shipId == s.id && d.status == 'Geleverd')), 0)}</b></td><td colspan="3"></td></tr></tfoot>` : '';

  return `<h1>Totaaloverzicht</h1>
  ${cap < NEED ? `<div class="card p-3.5 mb-4" style="border-left:5px solid var(--warn)"><b style="color:var(--warn)">Scheepscapaciteit te laag.</b> Bekend: ${cap} units, nodig: ${NEED}. Er ontbreken nog ${NEED - cap} units; voeg schepen toe op het tabblad Schepenlijst.</div>` : ''}
  <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-2.5 mb-5">${k.map(x => `<div class="card p-3 kpi"><span>${x[0]}</span><b>${x[1]}</b><span class="text-xs">${x[2]}</span></div>`).join('')}</div>
  <h2>Maandoverzicht</h2>
  <div class="card overflow-x-auto mb-5"><table><thead><tr><th>Maand</th><th>Leverdagen</th><th>Gepland</th><th>Bevestigd</th><th>Geleverd</th><th>Maandtotaal</th></tr></thead><tbody>${mrows}</tbody></table></div>
  <h2>Dagen boven de planningslimiet</h2>
  <div class="card overflow-x-auto mb-2"><table><thead><tr><th>Datum</th><th>Totaal</th><th>Gepland</th><th>Bevestigd</th><th>Geleverd</th><th>Nog niet geleverd</th></tr></thead><tbody>${overLimitRows || '<tr><td colspan="6" class="text-xs" style="color:var(--mut)">Geen openstaande dagen boven de planningslimiet.</td></tr>'}</tbody></table></div>
  <p class="text-xs mb-5" style="color:var(--mut)">De planningslimiet van ${DAILY_PLAN_LIMIT} units geldt alleen voor de status Gepland. Bevestigde en geleverde aantallen mogen hoger uitkomen; deze tabel signaleert dagen met meer dan ${DAILY_PLAN_LIMIT} units zolang nog niet alle units zijn geleverd. Er geldt hiervoor geen vooraf ingestelde harde bovengrens.</p>
  <h2>Voortgang per commercieel blok</h2>
  <div class="grid md:grid-cols-3 gap-2.5 mb-5">${blocks}</div>
  <h2>Voortgang per veldhuisje</h2>
  <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-2.5 mb-5">${huts}</div>
  <h2>Onderweg &middot; tracking</h2>
  <div class="card overflow-x-auto mb-2"><table><thead><tr><th>Schip</th><th>Units</th><th>Uiterste aanmeerdatum</th><th>Eerste levering</th><th>Status</th><th>Laatste positie (AIS)</th><th>MarineTraffic</th></tr></thead><tbody>${onway || '<tr><td colspan="7" class="text-xs" style="color:var(--mut)">Alle schepen zijn aangemeerd.</td></tr>'}</tbody>${onwayFoot}</table></div>
  <p class="text-xs mb-5" style="color:var(--mut)">Schepen die nog niet zijn aangemeerd, gesorteerd op uiterste aanmeerdatum. Positie, bestemming en ETA komen uit AIS en worden door grondstations langs de kust ontvangen; midden op zee kan een positie dus uren oud zijn. ${trackNote}</p>
  <h2>Aangemeerd &amp; gelost &middot; BESS-units op de Maasvlakte</h2>
  <div class="card overflow-x-auto"><table><thead><tr><th>Schip</th><th>Status</th><th>Capaciteit</th><th>In buffer</th><th>Geleverd in Farmsum</th><th>Volgende levering</th><th>Buffer leeg op</th><th>Voortgang</th></tr></thead><tbody>${mooredRows || '<tr><td colspan="8" class="text-xs" style="color:var(--mut)">Nog geen schepen aangemeerd.</td></tr>'}</tbody>${mooredFoot}</table></div>
  <div class="flex flex-wrap items-center gap-3 mt-2">
    <p class="text-xs" style="color:var(--mut)">In buffer = ingeplande units van aangemeerde schepen die nog niet in Farmsum zijn geleverd. &ldquo;Buffer leeg op&rdquo; is de laatste geplande levering van dat schip. Compleet geleverde schepen staan niet in dit overzicht.</p>
    ${doneCount ? `<button class="btn" onclick="toggleDone()">${SHOW_DONE ? 'Verberg' : 'Toon'} compleet geleverde schepen (${doneCount})</button>` : ''}
  </div>`;
}

/* ---------- Afdrukken ---------- */
function allHtml() {
  const cur = tab;
  let h = '';
  TABS.slice(0, SHIPS_TAB + 1).forEach((t, i) => {
    tab = i;
    render();
    h += `<section style="${i < SHIPS_TAB ? 'break-after:page;' : ''}margin-bottom:24px">${$('main').innerHTML}</section>`;
  });
  tab = cur;
  render();
  return h;
}

function printOut(all) {
  if (!all) { window.print(); return; }
  const html = '<!doctype html><html lang="nl" data-theme="light"><head><meta charset="utf-8"><title>' + (all ? 'Alle tabbladen' : TABS[tab]) + '</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet"><style>' + [...document.querySelectorAll('style')].map(s => s.textContent).join('\n') + '<\/style></head><body><div class="ph"><b style="font-size:15px">BESS Leveringskalender GIGA Leopard</b><span>Afgedrukt op ' + new Date().toLocaleDateString('nl-NL') + '</span></div><main>' + (all ? allHtml() : $('main').innerHTML) + '</main><script>addEventListener("load",function(){setTimeout(function(){print()},900)})<\/script></body></html>';
  dl('bess-' + (all ? 'alle-tabbladen' : TABS[tab]).toLowerCase().replace(/\s+/g, '-') + '-print.html', new Blob([html], { type: 'text/html' }));
  toast('Open het gedownloade bestand: het printvenster (A3 liggend) start automatisch.');
}

/* ---------- Export & Import ---------- */
function dl(name, data) {
  const b = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function expXLSX() {
  if (typeof XLSX == 'undefined') return toast('Excel-bibliotheek niet geladen.');
  const wb = XLSX.utils.book_new(), A = (n, rows, w) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = (w || []).map(x => ({ wch: x }));
    XLSX.utils.book_append_sheet(wb, ws, n);
  };
  const D = S.deliveries, sn = id => shipOf(id)?.name || '', by = f => D.filter(f), g = a => sum(a.filter(d => d.status == 'Geleverd')), tot = sum(D), del = g(D), cap = S.ships.reduce((t, s) => t + s.cap, 0);
  const o = [
    ['BESS Leveringskalender GIGA Leopard'], [],
    ['KPI', 'Waarde'],
    ['Totale projectbehoefte', NEED],
    ['Bekende scheepscapaciteit', cap],
    ['Totaal ingepland', tot],
    ['Ingepland %', +(tot / NEED * 100).toFixed(1)],
    ['Geleverd', del],
    ['Geleverd %', +(del / NEED * 100).toFixed(1)],
    ['Resterend te leveren', NEED - del],
    ['Actieve leveringsdagen', new Set(D.map(d => d.date)).size],
    ['Buffer Maasvlakte (aangemeerd, nog niet geleverd)', S.ships.reduce((t, s) => t + bufferOf(s), 0)], [],
    ['Maand', 'Leverdagen', 'Gepland', 'Bevestigd', 'Geleverd', 'Maandtotaal']
  ];
  MON.forEach(([y, m]) => {
    const md = by(d => d.date.startsWith(y + '-' + p(m + 1))), b = s => sum(md.filter(d => d.status == s));
    o.push([MN[m] + ' ' + y, new Set(md.map(d => d.date)).size, b('Gepland'), b('Bevestigd'), b('Geleverd'), sum(md)]);
  });
  o.push([], ['Commercieel blok', 'Veldhuisjes', 'Capaciteit', 'Geleverd', 'Gepland']);
  for (const b in BL) {
    const f = by(d => HB[d.hut] == b), t = sum(f), gg = g(f);
    o.push([b, Object.keys(BL[b].h).join(', '), BCAP(b), gg, t - gg]);
  }
  o.push([], ['Veldhuisje', 'Blok', 'Capaciteit', 'Geleverd', 'Gepland', 'Geleverd %', 'Resterend']);
  for (const h in HUT) {
    const f = by(d => d.hut == h), t = sum(f), gg = g(f);
    o.push([h, HB[h], HUT[h], gg, t - gg, +(gg / HUT[h] * 100).toFixed(0), HUT[h] - t]);
  }
  o.push([], ['Schip', 'Capaciteit', 'Gepland/bevestigd', 'Geleverd', 'Uiterste aanmeerdatum', 'Aangemeerd', 'Vertrokken (gelost)', 'Buffer Maasvlakte']);
  S.ships.forEach(s => {
    const f = by(d => d.shipId == s.id), t = sum(f), gg = g(f), dtInfo = getShipDates(s.id);
    o.push([s.name, s.cap, t - gg, gg, dtInfo.deadlineLabel, s.arrived ? 'Ja' : 'Nee', s.departed ? 'Ja' : 'Nee', bufferOf(s)]);
  });
  A('Totaaloverzicht', o, [28, 16, 18, 14, 18, 22, 14]);

  MON.forEach(([y, m]) => {
    const pre = y + '-' + p(m + 1), md = by(d => d.date.startsWith(pre)), b = s => sum(md.filter(d => d.status == s)), last = new Date(y, m + 1, 0);
    const r = [
      [MN[m] + ' ' + y],
      ['Leverdagen', 'Gepland', 'Bevestigd', 'Geleverd', 'Maandtotaal'],
      [new Set(md.map(d => d.date)).size, b('Gepland'), b('Bevestigd'), b('Geleverd'), sum(md)], [],
      ['Week', 'Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Weektotaal', 'Geleverd', 'Gepland']
    ];
    const st = new Date(y, m, 1);
    st.setDate(1 - ((st.getDay() + 6) % 7));
    for (let w = new Date(st); w <= last; w.setDate(w.getDate() + 7)) {
      const row = [isoWeek(w)];
      let any = false, wd = [];
      for (let k = 0; k < 5; k++) {
        const d = new Date(w);
        d.setDate(w.getDate() + k);
        if (d.getMonth() != m) { row.push(''); continue; }
        any = true;
        const dl2 = S.deliveries.filter(x => x.date == ds(y, m, d.getDate()));
        wd.push(...dl2);
        row.push(d.getDate() + (dl2.length ? ': ' : '') + dl2.map(x => `${x.units}× ${sn(x.shipId)} → ${x.hut} (${x.status})`).join(' | '));
      }
      if (any) {
        const t = sum(wd), gg = g(wd);
        row.push(t, gg, t - gg);
        r.push(row);
      }
    }
    r.push([], ['Datum', 'Units', 'Schip', 'Veldhuisje', 'Blok', 'Status']);
    [...md].sort((a, c) => a.date.localeCompare(c.date)).forEach(x => r.push([fmtDate(x.date), x.units, sn(x.shipId), x.hut, HB[x.hut] || '', x.status]));
    A(MN[m] + ' ' + y, r, [8, 34, 34, 34, 34, 34, 12, 10, 10]);
  });

  A('Schepenlijst', [['Schip', 'Capaciteit', 'Gepland/bevestigd', 'Geleverd', 'Eerste levering', 'Uiterste aanmeerdatum', 'Aangemeerd', 'Vertrokken (gelost)', 'Buffer Maasvlakte'], ...S.ships.map(s => {
    const f = by(d => d.shipId == s.id), t = sum(f), gg = g(f), dtInfo = getShipDates(s.id);
    return [s.name, s.cap, t - gg, gg, dtInfo.firstLabel, dtInfo.deadlineLabel, s.arrived ? 'Ja' : 'Nee', s.departed ? 'Ja' : 'Nee', bufferOf(s)];
  })], [26, 12, 18, 12, 10, 16, 22, 12]);

  A('Alle leveringen', [['Datum', 'Schip', 'Veldhuisje', 'Blok', 'Units', 'Status'], ...[...D].sort((a, c) => a.date.localeCompare(c.date)).map(x => [fmtDate(x.date), sn(x.shipId), x.hut, HB[x.hut] || '', x.units, x.status])], [12, 26, 12, 10, 8, 12]);
  A('Units', [['Unit', 'Veldhuisje', 'Blok', 'Geleverd', 'Plaatsing gepland', 'Geplaatst', 'Status'], ...planRows()], [14, 12, 10, 14, 18, 14, 36]);
  const arr = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  dl('bess-complete-export.xlsx', new Blob([arr], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

const expJSON = () => dl('bess-planning.json', JSON.stringify(S, null, 2));

function impJSON(i) {
  if (!ed()) { i.value = ''; return; }
  const f = i.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!Array.isArray(s.ships) || !Array.isArray(s.deliveries)) throw 0;
      s.ships.forEach(sh => {
        if (!Object.prototype.hasOwnProperty.call(sh, 'arrived')) sh.arrived = false;
        if (!Object.prototype.hasOwnProperty.call(sh, 'departed')) sh.departed = false;
        if (sh.departed && !sh.arrived) sh.departed = false;
        if (!Object.prototype.hasOwnProperty.call(sh, 'trackingUrl')) sh.trackingUrl = '';
      });
      S = normalize({ ships: s.ships, deliveries: s.deliveries, lastMonth: s.lastMonth, units: s.units });
      save(); render(); toast('Planning geïmporteerd.');
    } catch (e) {
      toast('Ongeldig JSON-bestand.');
    }
    i.value = '';
  };
  r.readAsText(f);
}

$('modal').addEventListener('click', e => { if (e.target.id == 'modal') closeM(); });
render();
updatePublishUI();
if (DIRTY) toast('Je hebt lokale wijzigingen. Gebruik de melding bovenaan om ze te verwerpen.');
loadRemote();
loadTrack();
setInterval(loadRemote, 120000);
setInterval(loadTrack, 300000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadRemote(); loadTrack(); } });
</script>
